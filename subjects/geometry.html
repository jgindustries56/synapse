cale."}, {"term": "Compass", "def": "A tool for drawing circles and arcs, and so for transferring a length."}, {"term": "Perpendicular bisector", "def": "A line through the midpoint of a segment at a right angle to it."}, {"term": "Angle bisector", "def": "A ray that divides an angle into two congruent angles."}, {"term": "Copying a segment", "def": "Set the compass to the segment's length, then strike that same length along a new ray."}, {"term": "Copying an angle", "def": "Draw matching arcs across both angles, then transfer the arc's width with the compass."}, {"term": "Constructing an equilateral triangle", "def": "Draw a segment, then strike two arcs of that radius from its endpoints; where they cross is the third vertex."}, {"term": "Perpendicular through a point on a line", "def": "Strike equal arcs either side of the point, then build the perpendicular bisector of the segment they cut off."}, {"term": "Parallel through a point not on a line", "def": "Draw a transversal through the point, then copy the corresponding angle at the point."}, {"term": "Perpendicular Bisector Theorem", "def": "Every point on the perpendicular bisector of a segment is equidistant from the two endpoints."}, {"term": "Angle Bisector Theorem", "def": "Every point on the bisector of an angle is equidistant from the two sides of the angle."}], "ln-pairs": [{"term": "Complementary angles", "def": "Two angles whose measures add to 90°."}, {"term": "Supplementary angles", "def": "Two angles whose measures add to 180°."}, {"term": "Linear pair", "def": "Two adjacent angles whose non-common sides form a straight line; they are always supplementary."}, {"term": "Vertical angles", "def": "The opposite pair of angles formed by two intersecting lines; they are always congruent."}, {"term": "Adjacent angles", "def": "Two angles that share a vertex and a side but no interior points."}, {"term": "Acute angle", "def": "An angle measuring less than 90°."}, {"term": "Right angle", "def": "An angle measuring exactly 90°."}, {"term": "Obtuse angle", "def": "An angle measuring more than 90° but less than 180°."}, {"term": "Straight angle", "def": "An angle measuring exactly 180°."}, {"term": "Perpendicular lines", "def": "Two lines that meet to form a right angle."}, {"term": "Congruent angles", "def": "Angles with equal measure."}, {"term": "Angle bisector of an angle pair", "def": "A ray from the vertex that cuts the angle into two congruent halves."}], "ln-transversal": [{"term": "Transversal", "def": "A line that crosses two or more other lines at distinct points."}, {"term": "Corresponding angles", "def": "A pair in the same relative position at the two different intersections of a transversal."}, {"term": "Alternate interior angles", "def": "A pair on opposite sides of the transversal, both lying between the two lines."}, {"term": "Alternate exterior angles", "def": "A pair on opposite sides of the transversal, both lying outside the two lines."}, {"term": "Same-side interior angles", "def": "A pair on the same side of the transversal, both between the two lines; also called consecutive interior angles."}, {"term": "Same-side exterior angles", "def": "A pair on the same side of the transversal, both outside the two lines."}, {"term": "Corresponding Angles Postulate", "def": "If two parallel lines are cut by a transversal, every pair of corresponding angles is congruent."}, {"term": "Alternate Interior Angles Theorem", "def": "If two parallel lines are cut by a transversal, every pair of alternate interior angles is congruent."}, {"term": "Alternate Exterior Angles Theorem", "def": "If two parallel lines are cut by a transversal, every pair of alternate exterior angles is congruent."}, {"term": "Same-Side Interior Angles Theorem", "def": "If two parallel lines are cut by a transversal, every pair of same-side interior angles is supplementary."}, {"term": "Converse of the Alternate Interior Angles Theorem", "def": "If a transversal makes a pair of alternate interior angles congruent, the two lines are parallel."}, {"term": "Perpendicular Transversal Theorem", "def": "If a transversal is perpendicular to one of two parallel lines, it is perpendicular to the other as well."}], "ln-slopes": [{"term": "Slopes of two parallel lines", "def": "Equal."}, {"term": "Slopes of two perpendicular lines", "def": "Opposite reciprocals, so their product is -1."}, {"term": "Slope of a horizontal line", "def": "0"}, {"term": "Slope of a vertical line", "def": "Undefined."}, {"term": "Slope-intercept form", "def": "y = mx + b"}, {"term": "Point-slope form", "def": "y - y₁ = m(x - x₁)"}, {"term": "Slope from two points", "def": "(y₂ - y₁) ÷ (x₂ - x₁)"}, {"term": "What m stands for in y = mx + b", "def": "The slope of the line."}, {"term": "What b stands for in y = mx + b", "def": "The y-intercept — where the line crosses the y-axis."}], "ln-logic": [{"term": "Postulate", "def": "A statement accepted as true without proof."}, {"term": "Theorem", "def": "A statement proved true using definitions, postulates and theorems already established."}, {"term": "Definition", "def": "A statement giving the exact meaning of a term, and one that works in both directions."}, {"term": "Conjecture", "def": "An unproven statement suggested by a pattern or an observation."}, {"term": "Corollary", "def": "A theorem that follows immediately from another theorem."}, {"term": "Converse", "def": "The statement formed by swapping the hypothesis and the conclusion of a conditional."}, {"term": "Inverse", "def": "The statement formed by negating both the hypothesis and the conclusion of a conditional."}, {"term": "Contrapositive", "def": "The statement formed by swapping and then negating hypothesis and conclusion; it is logically equivalent to the original."}, {"term": "Counterexample", "def": "A single case that makes a statement false."}, {"term": "Segment Addition Postulate", "def": "If B lies between A and C, then AB + BC = AC."}, {"term": "Angle Addition Postulate", "def": "If P lies in the interior of angle ABC, then m∠ ABP + m∠ PBC = m∠ ABC."}, {"term": "Reflexive Property", "def": "Any quantity equals itself, so AB = AB."}, {"term": "Symmetric Property", "def": "If a = b, then b = a."}, {"term": "Transitive Property", "def": "If a = b and b = c, then a = c."}, {"term": "Substitution Property", "def": "A quantity may be replaced by an equal quantity in any expression."}, {"term": "Deductive reasoning", "def": "Reaching a certain conclusion by applying accepted facts and logic."}, {"term": "Inductive reasoning", "def": "Reaching a likely conclusion by observing a pattern across specific cases."}, {"term": "\"If it is Atlanta, then it is in the U.S.\"", "def": "True — Atlanta really is in the United States."}, {"term": "The converse of that statement", "def": "\"If it is in the U.S., then it is Atlanta\" — false, since the U.S. holds many other places."}, {"term": "What the Atlanta example shows", "def": "A conditional can be true while its converse is false, so the two have to be judged separately."}, {"term": "A statement that is sometimes true and sometimes false", "def": "It is simply not a theorem; one counterexample is enough to sink it."}], "tri-angles": [{"term": "Triangle Sum Theorem", "def": "The three interior angles of a triangle add to 180°."}, {"term": "Exterior Angle Theorem", "def": "An exterior angle of a triangle equals the sum of the two remote interior angles."}, {"term": "Remote interior angles", "def": "The two interior angles not adjacent to a given exterior angle."}, {"term": "Third Angles Theorem", "def": "If two angles of one triangle are congruent to two angles of another, the third angles are congruent too."}, {"term": "Acute triangle", "def": "A triangle whose three angles are all less than 90°."}, {"term": "Right triangle", "def": "A triangle with exactly one 90° angle."}, {"term": "Obtuse triangle", "def": "A triangle with exactly one angle greater than 90°."}, {"term": "Equiangular triangle", "def": "A triangle whose three angles each measure 60°."}, {"term": "Scalene triangle", "def": "A triangle with no two sides congruent."}, {"term": "Isosceles triangle", "def": "A triangle with at least two congruent sides."}, {"term": "Equilateral triangle", "def": "A triangle with three congruent sides."}, {"term": "Triangle Inequality Theorem", "def": "The sum of any two side lengths of a triangle is greater than the third side."}, {"term": "Exterior angle sum of a triangle", "def": "The three exterior angles, one at each vertex, add to 360°."}], "tri-congruence": [{"term": "SSS", "def": "Three pairs of congruent sides prove two triangles congruent."}, {"term": "SAS", "def": "Two pairs of congruent sides and the congruent angle between them prove two triangles congruent."}, {"term": "ASA", "def": "Two pairs of congruent angles and the congruent side between them prove two triangles congruent."}, {"term": "AAS", "def": "Two pairs of congruent angles and a congruent side that is not between them prove two triangles congruent."}, {"term": "HL", "def": "In right triangles only, congruent hypotenuses and one congruent pair of legs prove congruence."}, {"term": "Included angle", "def": "The angle sitting between two named sides."}, {"term": "Included side", "def": "The side sitting between two named angles."}, {"term": "SSA", "def": "Not a congruence shortcut — two sides and a non-included angle can produce two different triangles."}, {"term": "AAA", "def": "Not a congruence shortcut — three pairs of congruent angles prove similarity, not congruence."}], "tri-cpctc": [{"term": "CPCTC", "def": "Corresponding Parts of Congruent Triangles are Congruent."}, {"term": "When CPCTC may be used", "def": "Only after the two triangles have already been proved congruent."}, {"term": "Corresponding parts", "def": "The sides and angles matched up by the congruence statement, read in order."}, {"term": "Reading a congruence statement", "def": "Triangle ABC congruent to triangle DEF ing a trapezoid on the grid", "def": "Show exactly one pair of opposite sides has equal slopes."}], "qd-parallelogram": [{"term": "Definition of a parallelogram", "def": "A quadrilateral with both pairs of opposite sides parallel."}, {"term": "Opposite sides of a parallelogram", "def": "They are congruent as well as parallel."}, {"term": "Opposite angles of a parallelogram", "def": "They are congruent."}, {"term": "Consecutive angles of a parallelogram", "def": "They are supplementary."}, {"term": "Diagonals of a parallelogram", "def": "They bisect each other."}, {"term": "One pair of opposite sides both parallel and congruent", "def": "Enough on its own to prove a quadrilateral is a parallelogram."}, {"term": "The five ways to prove a parallelogram", "def": "Both pairs of opposite sides parallel; both pairs of opposite sides congruent; both pairs of opposite angles congruent; diagonals bisecting each other; one pair of opposite sides both parallel and congruent."}, {"term": "Area of a parallelogram", "def": "base × height"}], "qd-diagonals": [{"term": "Diagonals of a rectangle", "def": "Congruent, and they bisect each other."}, {"term": "Diagonals of a rhombus", "def": "Perpendicular, and they bisect the angles of the figure."}, {"term": "Diagonals of a square", "def": "Congruent, perpendicular, and they bisect the angles."}, {"term": "Diagonals of a kite", "def": "Perpendicular, with exactly one of them bisecting the other."}, {"term": "Diagonals of an isosceles trapezoid", "def": "Congruent, but they do not bisect each other."}, {"term": "Diagonals of a parallelogram that is neither a rectangle nor a rhombus", "def": "They bisect each other, but they are neither congruent nor perpendicular."}, {"term": "Diagonals of a general trapezoid", "def": "Nothing special — they are neither congruent nor perpendicular in general."}], "qd-family": [{"term": "Quadrilateral", "def": "A polygon with four sides."}, {"term": "Trapezoid", "def": "A quadrilateral with exactly one pair of parallel sides."}, {"term": "Isosceles trapezoid", "def": "A trapezoid whose legs are congruent, giving congruent base angles and congruent diagonals."}, {"term": "Kite", "def": "A quadrilateral with two distinct pairs of congruent adjacent sides."}, {"term": "Parallelogram", "def": "A quadrilateral with both pairs of opposite sides parallel."}, {"term": "Rectangle", "def": "A parallelogram with four right angles."}, {"term": "Rhombus", "def": "A parallelogram with four congruent sides."}, {"term": "Square", "def": "A parallelogram that is both a rectangle and a rhombus."}, {"term": "Midsegment of a trapezoid", "def": "The segment joining the midpoints of the legs; it is parallel to the bases and half their sum."}, {"term": "Base angles of a trapezoid", "def": "A pair of angles sharing the same base."}, {"term": "Legs of a trapezoid", "def": "The two non-parallel sides."}], "qd-polygon": [{"term": "Interior angle sum of an n-gon", "def": "(n - 2) × 180°"}, {"term": "Each interior angle of a regular n-gon", "def": "(n - 2) × 180° ÷ n"}, {"term": "Exterior angle sum of any convex polygon", "def": "360°"}, {"term": "Each exterior angle of a regular n-gon", "def": "360° ÷ n"}, {"term": "Number of diagonals of an n-gon", "def": "n(n - 3) ÷ 2"}, {"term": "Why the interior sum formula has (n - 2)", "def": "A polygon splits into n - 2 triangles from one vertex, each contributing 180°."}, {"term": "An interior angle and its exterior angle", "def": "They form a linear pair, so they add to 180°."}], "tr-notation": [{"term": "Arrow notation", "def": "Writes the rule as the image of a point: (x, y) → (x - 4, y + 2)."}, {"term": "Vector notation", "def": "Writes the move as one bracketed pair, run then rise: ⟨-4, 2⟩."}, {"term": "Displacement", "def": "Reports how far the figure moved in each direction and drops the signs: (4, 2)."}, {"term": "Reading \"left 4, up 2\" as a rule", "def": "Subtract 4 from every x and add 2 to every y."}, {"term": "What a sign inside a vector "term": "Congruent polygons", "def": "The same shape and the same size."}, {"term": "Similar polygons", "def": "The same shape, though not necessarily the same size."}, {"term": "The similarity symbol", "def": "~ , written between the two figure names."}, {"term": "Corresponding angles of similar polygons", "def": "They are congruent — exactly equal in measure."}, {"term": "Corresponding sides of similar polygons", "def": "They are proportional — in a constant ratio to one another."}, {"term": "Similarity statement", "def": "Naming the two figures with their vertices in matching order, as triangle ABC ~ triangle DEF."}, {"term": "What \"similar\" does not mean", "def": "It does not mean the same size; only the shape has to match."}, {"term": "Corresponding parts", "def": "The sides and angles that the statement pairs up, read in order."}], "sim-scale": [{"term": "Scale factor", "def": "The constant ratio between corresponding sides of two similar figures."}, {"term": "Finding a scale factor", "def": "Divide a side of the second figure by the matching side of the first."}, {"term": "A scale factor greater than 1", "def": "The second figure is larger than the first."}, {"term": "A scale factor between 0 and 1", "def": "The second figure is smaller than the first."}, {"term": "A scale factor of exactly 1", "def": "The figures are congruent."}, {"term": "Solving for a missing side", "def": "Set up a proportion from two pairs of corresponding sides, then cross multiply."}, {"term": "Cross multiplying 15/3 = (x + 12)/4", "def": "60 = 3x + 36, so x = 8."}], "sim-shortcuts": [{"term": "SSS similarity", "def": "All three pairs of corresponding sides are in the same ratio."}, {"term": "SAS similarity", "def": "Two pairs of corresponding sides are in the same ratio and the angles between them are congruent."}, {"term": "AA similarity", "def": "Two pairs of corresponding angles are congruent, which forces the third pair as well."}, {"term": "Why AA is enough for similarity", "d izontal to something above you."}, {"term": "Angle of depression", "def": "The angle down from the horizontal to something below you."}, {"term": "Why eye height gets added back", "def": "The triangle starts at eye level, so the observer’s own height has to be added to reach the full height."}, {"term": "Two-triangle distance problems", "def": "Find each horizontal distance from its own angle, then subtract one from the other."}, {"term": "Building height from tan(54°) = 24/x with eyes 1.65 up", "def": "24 ÷ tan(54°) + 1.65, about 19.087"}, {"term": "Lake width from tan(37°) and tan(44°) at 1500 ft", "def": "1500 ÷ tan(37°) - 1500 ÷ tan(44°), about 437.272 ft"}, {"term": "Height on a ferris wheel", "def": "Find the reference angle, use sine to get the distance from the centre, then add it to the centre height if the rider is above it and subtract if below."}], "uc-angles": [{"term": "Coterminal angles", "def": "Angles that land on the same terminal side, found by adding or subtracting 360°."}, {"term": "Finding a coterminal angle", "def": "Add or subtract 360° as many times as you need."}, {"term": "Three angles coterminal with 32°", "def": "-328°, 392° and 752°."}, {"term": "Reference angle", "def": "The acute angle between the terminal side and the x-axis."}, {"term": "Reducing an angle above 360°", "def": "Subtract 360° until it lands between 0° and 360°."}, {"term": "Reference angle of 585°", "def": "45° — subtract 360° to reach 225°, then 180°."}, {"term": "Why reference angles are worth the trouble", "def": "They let you read any angle off the first-quadrant values, leaving only the sign to settle."}], "uc-quadrants": [{"term": "Where sine is positive", "def": "Quadrants I and II, because sine follows y."}, {"term": "Where cosine is positive", "def": "Quadrants I and IV, because cosine follows x."}, {"term": "Where tangent is positive", "def": "Quadrants I and III, where x and y share a sign."}, {"term": "Where sine is negative", "def": "Quadrants III and IV." dds: -8 + 3."}, {"prompt": "The minus sign in front of a bracket applies to", "answer": "Every term inside it", "choices": ["Every term inside it", "Only the first term", "Only the constant", "Nothing — it can be dropped"]}, {"prompt": "The degree of (2x² + 5)(x² - 11x + 6) is", "answer": "4", "choices": ["4", "3", "2", "6"], "note": "2 + 2."}], "poly-area": [{"prompt": "A rectangle (3x + 2) by (x + 15) has an area of", "answer": "3x² + 47x + 30", "choices": ["3x² + 47x + 30", "3x² + 45x + 30", "3x² + 17x + 30", "4x² + 47x + 30"], "note": "45x and 2x collect to 47x."}, {"prompt": "A rectangle 2x by (x + 1) has an area of", "answer": "2x² + 2x", "choices": ["2x² + 2x", "2x² + 1", "2x + 2", "3x² + 2x"]}, {"prompt": "The shaded area between those two rectangles is", "answer": "x² + 45x + 30", "choices": ["x² + 45x + 30", "x² + 47x + 30", "5x² + 49x + 30", "x² + 45x"]}, {"prompt": "To find a shaded area you", "answer": "Subtract the inner area from the outer area", "choices": ["Subtract the inner area from the outer area", "Add the two areas", "Multiply the two areas", "Subtract the perimeters"]}, {"prompt": "In the subtraction 3x² - 2x², you get", "answer": "x²", "choices": ["x²", "1", "x", "5x²"]}, {"prompt": "And 47x - 2x gives", "answer": "45x", "choices": ["45x", "49x", "45", "2x"]}, {"prompt": "The usual mistake in a shaded-area problem is", "answer": "Subtracting only part of the inner area", "choices": ["Subtracting only part of the inner area", "Using the wrong formula for a rectangle", "Forgetting to square the answer", "Adding the perimeters"]}, {"prompt": "A shaded area expression is", "answer": "Still a polynomial", "choices": ["Still a polynomial", "Always a number", "Always linear", "Never factorable"]}]};

  var TOPIC_MAP = {};
  TOPICS.forEach(function(t){ TOPIC_MAP[t.id] = t; });

  function topicIcon(id){ return TOPIC_ICONS[id] || '◻'; }

  /* Two cards per term, in both directions, plus one card per applied
     question. The wrong options for a term card come from the sibling terms in
     the same topic, which is why the build script checks that no two terms in
     a topic share a meaning. */
  function defsItems(list, topic){
    var out = [];
    var termPool = list.map(function(w){ return w.term; });
    var defPool = list.map(function(w){ return w.def; });
    list.forEach(function(w, i){
      out.push({id:'t2d-'+topic+'-'+i, topic:topic, type:'term2def', prompt:w.term, answer:[w.def], pool:defPool});
      out.push({id:'d2t-'+topic+'-'+i, topic:topic, type:'def2term', prompt:w.def, answer:[w.term], pool:termPool});
    });
    return out;
  }

  function mcItems(list, topic, idPrefix){
    var out = [];
    list.forEach(function(it, i){
      var answer = Array.isArray(it.answer) ? it.answer : [it.answer];
      out.push({id:idPrefix+'-'+topic+'-'+i, topic:topic, type: it.choices ? 'mc' : 'typed',
                forceTyped: !it.choices, prompt:it.prompt, answer:answer,
                choices:it.choices, note:it.note});
    });
    return out;
  }

  var ALL_ITEMS = [];
  TOPICS.forEach(function(t){
    if(TERM_LISTS[t.id]) ALL_ITEMS = ALL_ITEMS.concat(defsItems(TERM_LISTS[t.id], t.id));
    if(APPLIED[t.id]) ALL_ITEMS = ALL_ITEMS.concat(mcItems(APPLIED[t.id], t.id, 'mc'));
  });

  var ITEMS_BY_TOPIC = {};
  ALL_ITEMS.forEach(function(it){
    if(!ITEMS_BY_TOPIC[it.topic]) ITEMS_BY_TOPIC[it.topic] = [];
    ITEMS_BY_TOPIC[it.topic].push(it);
  });

  /* ============================= UTIL ============================= */
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function daysFromToday(n){
    var d = new Date();
    d.setDate(d.getDate()+n);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  /* ============================= PROGRESS / SRS =============================
     Leitner boxes on the same intervals as every other subject: a card missed
     goes back to box 0 and comes round again today; a card answered correctly
     moves up one box and is not shown again until its interval has passed.
     Spacing like this is the single best-evidenced study technique there is —
     the same total minutes spread over days beats the same minutes in one
     sitting, by a wide margin, on every delayed test. */
  var STORE_KEY = 'geometry_progress_v1';
  var INTERVALS = [0,1,3,7,14,30];

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {items:{}, streak:{count:0,last:null}};
  }
  var PROGRESS = loadProgress();
  migrateProgress(PROGRESS);

  function migrateProgress(P){
    if(!P.history) P.history = [];
    if(!P.settings) P.settings = {};
    if(!P.days){
      P.days = {};
      P.history.forEach(function(h){ if(h.date) P.days[h.date] = (P.days[h.date]||0) + (h.total||1); });
      if(P.streak && P.streak.last && !P.days[P.streak.last]) P.days[P.streak.last] = 1;
    }
    if(!P.streak) P.streak = {count:0, last:null};
    if(!P.items) P.items = {};
    return P;
  }

  function saveProgress(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(PROGRESS)); }catch(e){}
    if(AUTH.user) pushProgress();
  }

  function getProg(id){ return PROGRESS.items[id]; }

  function recordAnswer(id, correct){
    var p = PROGRESS.items[id] || {box:-1, due:todayStr(), seen:0, correct:0, incorrect:0};
    p.seen++;
    if(correct){
      p.correct++;
      p.box = Math.min((p.box<0?-1:p.box)+1, 5);
      p.due = daysFromToday(INTERVALS[Math.max(p.box,0)]);
    }else{
      p.incorrect++;
      p.box = 0;
      p.due = todayStr();
    }
    PROGRESS.items[id] = p;
    bumpDay();
    bumpStreak();
    saveProgress();
  }

  function bumpDay(){
    if(!PROGRESS.days) PROGRESS.days = {};
    var t = todayStr();
    PROGRESS.days[t] = (PROGRESS.days[t]||0) + 1;
  }

  function bumpStreak(){
    var t = todayStr();
    if(!PROGRESS.streak) PROGRESS.streak = {count:0, last:null};
    if(PROGRESS.streak.last === t) return;
    var y = daysFromToday(-1);
    PROGRESS.streak.count = (PROGRESS.streak.last === y) ? (PROGRESS.streak.count + 1) : 1;
    PROGRESS.streak.last = t;
  }

  /* ============================= SIGN-IN / CLOUD SYNC =============================
     Optional and self-disabling: served anywhere but our own backend, the
     client id placeholder is never filled in and every /api/* call below fails
     quietly, leaving a perfectly good local-only app. */
  var GOOGLE_CLIENT_ID = (function(){
    var v = (typeof window !== 'undefined') ? window.__GOOGLE_CLIENT_ID__ : null;
    return (v && v.indexOf('.apps.googleusercontent.com') !== -1) ? v : null;
  })();
  var AUTH = { user:null };
  // Tags this subject's data so the hub server keeps it in its own file.
  var SUBJECT = 'geometry';

  function apiFetch(url, opts){
    opts = opts || {};
    var headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
    return fetch(url, Object.assign({credentials:'same-origin'}, opts, {headers:headers}))
      .then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(data){
          return {ok:r.ok, status:r.status, data:data};
        });
      });
  }

  function pushProgress(){
    if(!AUTH.user) return;
    apiFetch('/api/progress?subject='+SUBJECT, {method:'PUT', body: JSON.stringify(PROGRESS)}).catch(function(){});
  }

  /* A PUT rather than a GET on purpose: the server merges what this device has
     with what the account already holds and hands back the union, so opening
     the app on a second device neither loses nor rolls back work. */
  function pullProgress(){
    return apiFetch('/api/progress?subject='+SUBJECT, {method:'PUT', body: JSON.stringify(PROGRESS)}).then(function(res){
      if(res.ok && res.data.progress){
        PROGRESS = migrateProgress(res.data.progress);
      }
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(PROGRESS)); }catch(e){}
      render();
    }).catch(function(){});
  }

  function replaceProgressOnServer(){
    if(!AUTH.user) return;
    apiFetch('/api/progress?subject='+SUBJECT+'&mode=replace', {method:'PUT', body: JSON.stringify(PROGRESS)}).catch(function(){});
  }

  function handleGoogleCredential(response){
    apiFetch('/api/auth/google', {method:'POST', body: JSON.stringify({credential: response.credential})})
      .then(function(res){
        if(res.ok && res.data.user){
          AUTH.user = res.data.user;
          return pullProgress();
        }
        render();
      }).catch(function(){});
  }

  function signOut(){
    apiFetch('/api/auth/logout', {method:'POST'}).catch(function(){});
    AUTH.user = null;
    render();
  }

  function initAuth(){
    if(!GOOGLE_CLIENT_ID) return;
    apiFetch('/api/me').then(function(res){
      if(res.ok && res.data.user){
        AUTH.user = res.data.user;
        pullProgress();
      }
    }).catch(function(){});
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function(){
      try{
        google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:handleGoogleCredential});
      }catch(e){}
      render();
    };
    document.head.appendChild(s);
  }

  /* ===================== INTERFACE =====================
     Everything above owns the data. The engine renders it and reports answers
     back through the adapter below, so scheduling, sync and content stay here
     and only the interface lives in public/synapse.js. */
  var ENGINE_ON = false;

  function engineData(){
    var unitOf = {};
    UNIT_GROUPS.forEach(function(u){ u.topicIds.forEach(function(id){ unitOf[id] = u; }); });

    var topics = TOPICS.map(function(t){
      var u = unitOf[t.id];
      var meta = (u && SOURCE_UNITS[u.id]) || {};
      var sec = SOURCE_SECTIONS[t.id];
      return {
        id: t.id, name: t.name, cat: t.cat, blurb: t.blurb,
        source: {
          book: 'Math',
          unit: meta.title || (u ? u.name : ''),
          unitId: u ? u.id : '',
          section: sec ? sec[0] : (CAT_LABELS[t.cat] || 'Other'),
          order: sec ? sec[1] : 50,
          page: meta.page || null
        }
      };
    });

    var units = UNIT_GROUPS.map(function(u){
      var meta = SOURCE_UNITS[u.id] || {};
      return { id:u.id, name:u.name, title: meta.title || u.name,
               book: 'Math', page: meta.page || null, topicIds: u.topicIds };
    });

    var items = ALL_ITEMS.map(function(it){
      var o = {id:it.id, topic:it.topic, type:it.type, prompt:it.prompt, answer:it.answer};
      if(it.choices) o.choices = it.choices;
      if(it.pool) o.pool = it.pool;
      if(it.note) o.note = it.note;
      return o;
    });

    return {topics:topics, units:units, icons:TOPIC_ICONS, items:items};
  }

  function mountEngine(){
    window.Synapse.mount({
      subject: SUBJECT,
      name: 'Math',
      short: 'Math',
      tagline: 'Geometry, right-triangle trig, the unit circle and polynomial division.',
      nav: 'rail',
      shell: 'wide',
      catsNote: 'Definitions, rules, theorems and applied work, scored the same way.',
      goal: 30,
      unitWord: 'Unit',
      cats: CAT_LABELS,
      speak: false,
      lang: 'en-US',
      rootId: 'app',
      data: engineData(),

      progress: {
        read: function(){ return PROGRESS; },
        save: function(){ saveProgress(); },

        record: function(id, correct){
          var was = getProg(id);
          var from = was ? Math.max(was.box, 0) : 0;
          recordAnswer(id, correct);
          var now = getProg(id) || {};
          return { from: Math.max(from, 1), to: Math.max(now.box || 0, 1), due: now.due };
        },

        logSession: function(entry){
          var e = {
            ts: Date.now(), date: todayStr(), mode: entry.mode || 'session',
            label: entry.mode || '', correct: entry.correct, total: entry.total, pct: entry.pct
          };
          if(!PROGRESS.history) PROGRESS.history = [];
          PROGRESS.history.push(e);
          if(PROGRESS.history.length > 50) PROGRESS.history = PROGRESS.history.slice(-50);
          saveProgress();
          if(AUTH.user){
            apiFetch('/api/session-complete', {method:'POST',
              body: JSON.stringify(Object.assign({subject:SUBJECT}, e))}).catch(function(){});
          }
        },

        reset: function(){
          PROGRESS = migrateProgress({items:{}, streak:{count:0,last:null}});
          saveProgress();
          replaceProgressOnServer();
        },

        setGoal: function(n){ PROGRESS.goal = n; saveProgress(); }
      },

      auth: {
        user: function(){ return AUTH.user; },
        configured: function(){ return !!GOOGLE_CLIENT_ID; },
        signOut: function(){ signOut(); },
        // Google draws its own button; the engine supplies the slot.
        mountButton: function(slot){
          try{
            google.accounts.id.renderButton(slot, {theme:'outline', size:'medium', text:'signin'});
          }catch(e){ /* the Google script is not up yet; the chrome redraws when it is */ }
        },
        // Pressed only if Google's own button never arrived.
        prompt: function(){
          try{ google.accounts.id.prompt(); }catch(e){}
        }
      }
    });
    ENGINE_ON = true;
  }

  function render(){
    if(!window.Synapse) return;
    if(ENGINE_ON) window.Synapse.refresh(); else mountEngine();
  }

  render();
  initAuth();
})();
</script>
