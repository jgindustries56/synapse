<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Human Geography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#EFF3F5;
    --surface:#FFFFFF;
    --surface-2:#DCE6EA;
    --ink:#0F2430;
    --ink-soft:#516773;
    --rule:#C7D6DC;
    --accent-navy:#1E5FA8;
    --accent-navy-ink:#153F70;
    --accent-pine:#2E9B7A;
    --accent-pine-ink:#1D6852;
    --accent-gold:#C98A2E;
    --accent-gold-ink:#8A5E1D;
    --accent-clay:#E0654A;
    --accent-clay-ink:#A8432E;
    --accent-red:#AC3A2C;
    --accent-red-ink:#8A2D22;
    --on-accent:#F5FAFC;
    --shadow: 0 1px 2px rgba(15,36,48,.06), 0 6px 16px -8px rgba(15,36,48,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E1A22;
      --surface:#16242E;
      --surface-2:#1E323D;
      --ink:#DCEAF0;
      --ink-soft:#8FA8B4;
      --rule:#2B3F4A;
      --accent-navy:#7FB2E8;
      --accent-navy-ink:#C7E0F7;
      --accent-pine:#6FD6B4;
      --accent-pine-ink:#BEF0DE;
      --accent-gold:#E8B968;
      --accent-gold-ink:#F7DCA8;
      --accent-clay:#F0947C;
      --accent-clay-ink:#FBCFC2;
      --accent-red:#E17A69;
      --accent-red-ink:#F3B4A8;
      --on-accent:#0E1A22;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1A22;
    --surface:#16242E;
    --surface-2:#1E323D;
    --ink:#DCEAF0;
    --ink-soft:#8FA8B4;
    --rule:#2B3F4A;
    --accent-navy:#7FB2E8;
    --accent-navy-ink:#C7E0F7;
    --accent-pine:#6FD6B4;
    --accent-pine-ink:#BEF0DE;
    --accent-gold:#E8B968;
    --accent-gold-ink:#F7DCA8;
    --accent-clay:#F0947C;
    --accent-clay-ink:#FBCFC2;
    --accent-red:#E17A69;
    --accent-red-ink:#F3B4A8;
    --on-accent:#0E1A22;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:'Work Sans',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Piazzolla',Georgia,'Times New Roman',serif;
    text-wrap:balance;
    font-weight:600;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; font-variant-numeric:tabular-nums;}
  .gloss{color:var(--ink-soft); font-size:.85em; font-style:italic;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent-navy); outline-offset:2px;}

  .app-shell{max-width:920px; margin:0 auto; padding:20px 20px 64px;}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    padding-bottom:18px; border-bottom:1px solid var(--rule); margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; gap:2px; cursor:pointer; background:none; border:none; text-align:left; padding:0; color:inherit;}
  .brand h1{font-size:1.6rem; letter-spacing:.2px;}
  .brand .sub{color:var(--ink-soft); font-size:.82rem;}
  .top-stats{display:flex; align-items:center; gap:14px;}
  .chip{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--rule); border-radius:999px;
    padding:7px 12px; font-size:.82rem; box-shadow:var(--shadow);
  }
  .chip .num{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.95rem;}
  .ring-wrap{position:relative; width:44px; height:44px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-wrap .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:.62rem; font-weight:600;
  }
  .info-btn{
    background:var(--surface-2); border:1px solid var(--rule); color:var(--ink);
    width:30px; height:30px; border-radius:50%; cursor:pointer; font-family:'Piazzolla',serif; font-style:italic; font-weight:700;
  }
  .info-panel{
    background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:16px 18px;
    margin-bottom:20px; box-shadow:var(--shadow); font-size:.88rem; line-height:1.55;
  }
  .info-panel h3{font-size:.95rem; margin-bottom:8px;}
  .info-panel ul{margin:0; padding-left:1.1em; color:var(--ink-soft);}
  .info-panel li{margin-bottom:4px;}
  .info-panel li b{color:var(--ink); font-weight:600;}

  /* ---------- dashboard ---------- */
  .section-label{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft);
    margin:26px 0 10px; font-weight:600;
  }
  .dash-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .topic-card{
    background:var(--surface); border:1px solid var(--rule); border-radius:10px;
    box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;
  }
  .topic-tab{height:6px; width:100%;}
  .topic-tab.cat-concepts{background:var(--accent-gold);}
  .topic-tab.cat-formulas{background:var(--accent-navy);}
  .topic-tab.cat-models{background:var(--accent-pine);}
  .topic-tab.cat-cases{background:var(--accent-clay);}
  .topic-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .topic-title{font-family:'Piazzolla',serif; font-weight:600; font-size:1.05rem;}
  .topic-blurb{font-size:.8rem; color:var(--ink-soft); line-height:1.4;}
  .mastery-row{display:flex; align-items:center; gap:8px; font-size:.72rem; color:var(--ink-soft);}
  .mastery-bar{flex:1; height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
  .mastery-fill{height:100%; border-radius:99px;}
  .mastery-fill.cat-concepts{background:var(--accent-gold);}
  .mastery-fill.cat-formulas{background:var(--accent-navy);}
  .mastery-fill.cat-models{background:var(--accent-pine);}
  .mastery-fill.cat-cases{background:var(--accent-clay);}
  .topic-actions{display:flex; gap:8px; margin-top:auto;}

  .btn{
    border-radius:8px; border:1px solid var(--rule); background:var(--surface);
    padding:9px 14px; font-size:.83rem; font-weight:600; cursor:pointer; color:var(--ink);
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-sm{padding:7px 11px; font-size:.78rem; flex:1;}
  .btn-primary{background:var(--accent-navy); border-color:var(--accent-navy); color:var(--on-accent);}
  .btn-pine{background:var(--accent-pine); border-color:var(--accent-pine); color:var(--on-accent);}
  .btn-ghost{background:transparent;}
  .btn-block{width:100%;}
  .btn-lg{padding:14px 18px; font-size:.95rem; border-radius:10px;}

  .global-actions{display:flex; gap:12px; margin-top:24px; flex-wrap:wrap;}
  .global-card{
    flex:1; min-width:220px; background:var(--surface); border:1px solid var(--rule); border-radius:12px;
    padding:18px 20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
  }
  .global-card h3{font-size:1.05rem;}
  .global-card p{margin:0; font-size:.82rem; color:var(--ink-soft); line-height:1.45;}

  .footer-links{margin-top:34px; text-align:center; font-size:.76rem; color:var(--ink-soft);}
  .footer-links button{background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; font-size:.76rem;}

  /* ---------- learn (flashcards) ---------- */
  .view-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap;}
  .back-btn{background:none; border:none; color:var(--ink-soft); font-size:.84rem; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .progress-track{flex:1; height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin:0 14px;}
  .progress-fill{height:100%; background:var(--accent-navy); border-radius:99px; transition:width .25s ease;}
  .progress-text{font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--ink-soft); white-space:nowrap;}

  .flip-outer{perspective:1400px; max-width:520px; margin:0 auto;}
  .flip-card{
    position:relative; min-height:260px; cursor:pointer;
  }
  .flip-inner{
    position:relative; width:100%; min-height:260px; transition:transform .45s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  @media (prefers-reduced-motion:reduce){ .flip-inner{transition:none;} }
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; border:1px solid var(--rule);
    background:var(--surface); box-shadow:var(--shadow); padding:30px 26px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:10px;
    background-image:repeating-linear-gradient(var(--surface) 0 27px, var(--rule) 27px 28px);
  }
  .flip-face.back{transform:rotateY(180deg);}
  .card-icon{font-size:2rem; line-height:1;}
  .card-prompt{font-family:'Piazzolla',serif; font-size:1.5rem; font-weight:600;}
  .card-hint{color:var(--ink-soft); font-size:.82rem;}
  .card-answer{font-family:'Piazzolla',serif; font-size:1.6rem; font-weight:600; color:var(--accent-pine-ink);}
  .card-note{font-size:.85rem; color:var(--ink-soft); max-width:380px; line-height:1.4;}
  .learn-actions{display:flex; gap:10px; justify-content:center; margin-top:20px;}
  .tap-hint{text-align:center; color:var(--ink-soft); font-size:.78rem; margin-top:14px;}

  /* ---------- session (quiz/test) ---------- */
  .session-card{
    max-width:560px; margin:0 auto; background:var(--surface); border:1px solid var(--rule); border-radius:14px;
    box-shadow:var(--shadow); padding:28px 26px;
  }
  .qchip{
    display:inline-block; font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; font-weight:700;
    padding:3px 9px; border-radius:99px; margin-bottom:14px;
  }
  .qchip.cat-concepts{background:color-mix(in srgb, var(--accent-gold) 20%, transparent); color:var(--accent-gold-ink);}
  .qchip.cat-formulas{background:color-mix(in srgb, var(--accent-navy) 18%, transparent); color:var(--accent-navy-ink);}
  .qchip.cat-models{background:color-mix(in srgb, var(--accent-pine) 18%, transparent); color:var(--accent-pine-ink);}
  .qchip.cat-cases{background:color-mix(in srgb, var(--accent-clay) 20%, transparent); color:var(--accent-clay-ink);}
  .q-prompt{font-family:'Piazzolla',serif; font-size:1.35rem; font-weight:600; line-height:1.35; margin-bottom:18px;}
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .choice-btn{
    text-align:left; padding:12px 14px; border-radius:9px; border:1px solid var(--rule); background:var(--surface-2);
    font-size:.92rem; cursor:pointer; color:var(--ink);
  }
  .choice-btn{display:flex; align-items:center; gap:10px;}
  .choice-btn:hover{border-color:var(--accent-navy);}
  .choice-key{
    flex-shrink:0; width:20px; height:20px; border-radius:5px; background:var(--surface);
    border:1px solid var(--rule); font-size:.7rem; color:var(--ink-soft);
    display:inline-flex; align-items:center; justify-content:center;
  }
  @media (hover:none){ .choice-key{display:none;} }
  .choice-btn.correct{background:color-mix(in srgb, var(--accent-pine) 22%, var(--surface)); border-color:var(--accent-pine);}
  .choice-btn.incorrect{background:color-mix(in srgb, var(--accent-red) 20%, var(--surface)); border-color:var(--accent-red);}
  .choice-btn:disabled{cursor:default;}
  .text-row{display:flex; gap:10px;}
  .text-input{
    flex:1; padding:12px 14px; border-radius:9px; border:1px solid var(--rule); background:var(--surface-2);
    color:var(--ink); font-size:.95rem; font-family:'IBM Plex Mono',monospace;
  }
  .feedback{
    margin-top:18px; padding:13px 15px; border-radius:9px; font-size:.88rem; line-height:1.5;
    display:flex; gap:10px; align-items:flex-start;
  }
  .feedback.correct{background:color-mix(in srgb, var(--accent-pine) 16%, var(--surface)); border:1px solid var(--accent-pine);}
  .feedback.incorrect{background:color-mix(in srgb, var(--accent-red) 14%, var(--surface)); border:1px solid var(--accent-red);}
  .feedback .fmark{font-weight:700; font-size:1.05rem;}
  .feedback.correct .fmark{color:var(--accent-pine-ink);}
  .feedback.incorrect .fmark{color:var(--accent-red-ink);}
  .feedback b{font-weight:700;}
  .session-footer{display:flex; justify-content:flex-end; margin-top:18px;}

  /* ---------- results ---------- */
  .results-top{text-align:center; margin-bottom:26px;}
  .score-big{font-family:'Piazzolla',serif; font-weight:700; font-size:3rem;}
  .score-sub{color:var(--ink-soft); font-size:.9rem;}
  .breakdown-list{display:flex; flex-direction:column; gap:10px; margin-bottom:26px;}
  .breakdown-row{display:flex; align-items:center; gap:10px; font-size:.83rem;}
  .breakdown-name{width:170px; flex-shrink:0; color:var(--ink-soft);}
  .breakdown-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
  .breakdown-fill{height:100%; border-radius:99px; background:var(--accent-navy);}
  .breakdown-num{font-family:'IBM Plex Mono',monospace; font-size:.76rem; width:44px; text-align:right; color:var(--ink-soft);}
  .missed-list{display:flex; flex-direction:column; gap:10px; margin-bottom:24px;}
  .missed-item{background:var(--surface); border:1px solid var(--rule); border-radius:9px; padding:12px 14px; font-size:.85rem;}
  .missed-item .mp{color:var(--ink-soft); margin-bottom:3px;}
  .missed-item .ma{color:var(--accent-pine-ink); font-weight:600;}
  .results-actions{display:flex; gap:10px; flex-wrap:wrap;}

  @media (max-width:520px){
    .choices{grid-template-columns:1fr;}
    .breakdown-name{width:120px;}
  }

  /* ---------- nav bar ---------- */
  .nav-wrap{display:flex; flex-direction:column; gap:7px; margin-bottom:24px;}
  .nav-bar, .nav-subbar{display:flex; gap:6px;}
  .nav-btn, .nav-subbtn{
    flex:1 1 0; min-width:0; text-align:center; padding:8px 4px; border-radius:10px; border:1px solid var(--rule);
    background:var(--surface); font-size:.68rem; font-weight:700; color:var(--ink-soft); cursor:pointer;
    line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .nav-btn.active, .nav-subbtn.active{background:var(--accent-navy); border-color:var(--accent-navy); color:var(--on-accent);}
  .nav-btn{display:flex; flex-direction:column; align-items:center; gap:2px; white-space:normal;}
  .nav-btn>span:last-child{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-icon{font-size:1.05rem; line-height:1;}
  .nav-subbtn{border-radius:999px; padding:7px 4px; font-size:.72rem; background:var(--surface-2); border-color:transparent;}
  .nav-subbtn.active{background:var(--accent-navy);}

  /* ---------- page header ---------- */
  .page-title{font-size:1.5rem; margin-bottom:8px; text-wrap:balance;}
  .page-desc{color:var(--ink-soft); font-size:.9rem; line-height:1.55; max-width:62ch; margin:0 0 18px;}

  /* ---------- home progress ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
  .stat-tile{
    background:var(--surface); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow);
    padding:16px 18px; display:flex; flex-direction:column; gap:4px;
  }
  .stat-value{font-family:'Piazzolla',serif; font-size:1.7rem; font-weight:700;}
  .stat-label{font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);}
  .cat-bars{
    background:var(--surface); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow);
    padding:14px 18px; display:flex; flex-direction:column; gap:10px; margin-bottom:8px;
  }
  .cat-bar-row{display:flex; align-items:center; gap:10px; font-size:.82rem;}
  .cat-bar-name{width:100px; flex-shrink:0; color:var(--ink-soft);}
  .mastery-pct{font-size:.76rem; color:var(--ink-soft); width:38px; text-align:right;}

  .jump-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; margin-bottom:8px;}

  /* ---------- uniform tile grid ----------
     One tile shape for every module on Home (stats, category mastery, the
     heatmap, milestones) and for every topic picker (Home's Topics section,
     Study/Quiz/Test/Guided, Sheets): same radius, border, shadow, padding
     throughout. Only the grid span changes. */
  .uniform-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  .tile{background:var(--surface); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow); padding:16px;}
  .tile-wide{grid-column:1 / -1;}

  .tile-cat .cat-name{font-size:.82rem; font-weight:600;}
  .tile-cat .cat-track{height:6px; border-radius:99px; background:var(--surface-2); margin-top:10px; overflow:hidden;}
  .tile-cat .cat-fill{height:100%;}
  .tile-cat .cat-pct{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--ink-soft); margin-top:6px; display:block;}

  .tile-badge{display:flex; flex-direction:column; align-items:flex-start; gap:6px;}
  .tile-badge.locked{opacity:.5;}
  .tile-badge .bicon2{font-size:1.2rem;}
  .tile-badge .bname2{font-size:.76rem; font-weight:600;}

  /* chunked-unit tiles: a group of topics (here, a category), collapsed to a
     header + progress bar until tapped, then a two-column topic list. */
  .unit-tile{cursor:pointer;}
  .unit-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .unit-title{font-family:'Piazzolla',serif; font-weight:600; font-size:1.02rem;}
  .unit-meta{font-size:.76rem; color:var(--ink-soft); margin-top:3px;}
  .unit-arrow{font-size:.9rem; color:var(--ink-soft); transition:transform .2s; flex-shrink:0;}
  .unit-tile.open .unit-arrow{transform:rotate(90deg);}
  .unit-track{height:6px; border-radius:99px; background:var(--surface-2); margin-top:12px; overflow:hidden;}
  .unit-fill{height:100%;}
  .unit-topics{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .unit-tile.open .unit-topics{max-height:3000px;}
  .unit-topics-2col{margin-top:14px; column-count:2; column-gap:20px;}
  .unit-topic-row{
    display:flex; justify-content:space-between; align-items:center; width:100%; gap:10px;
    padding:9px 4px; border:none; border-bottom:1px solid var(--rule);
    background:none; font-family:inherit; text-align:left; cursor:pointer; color:var(--ink); break-inside:avoid;
  }
  .unit-topic-row:hover{background:var(--surface-2);}
  .unit-topic-row .n{font-size:.84rem;}
  .unit-topic-row .c{font-family:'IBM Plex Mono',monospace; font-size:.74rem; color:var(--ink-soft); flex-shrink:0; margin-left:8px;}

  @media (max-width:640px){
    .uniform-grid{grid-template-columns:repeat(2,1fr);}
    .unit-topics-2col{column-count:1;}
  }

  /* ---------- study methods ---------- */
  .method-icon{font-size:1.8rem; line-height:1;}

  /* ---------- guided exercises ---------- */
  .rule-card{max-width:560px; margin:0 auto; text-align:left;}
  .rule-card .page-title{margin-bottom:12px;}
  .rule-text{font-size:.95rem; line-height:1.6; color:var(--ink); margin:0 0 18px;}
  .rule-example{background:var(--surface-2); border-radius:9px; padding:14px 16px; margin-bottom:22px;}
  .rule-example-main{font-family:'Piazzolla',serif; font-size:1.1rem; font-weight:600; margin-bottom:4px;}
  .hint-row{margin:-4px 0 16px;}
  .hint-text{
    font-size:.82rem; color:var(--accent-gold-ink);
    background:color-mix(in srgb, var(--accent-gold) 14%, var(--surface));
    padding:9px 12px; border-radius:8px; line-height:1.4;
  }

  /* ---------- matching pairs ---------- */
  .match-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:6px;}
  .match-tile{
    min-height:72px; padding:12px 14px; border-radius:9px; border:1px solid var(--rule);
    background:var(--surface-2); font-size:.8rem; line-height:1.4; cursor:pointer; color:var(--ink);
    display:flex; align-items:center; justify-content:center; text-align:center;
    overflow-wrap:break-word; word-break:break-word; hyphens:auto;
  }
  .match-tile:disabled{cursor:default;}
  .match-tile.selected{border-color:var(--accent-navy); background:color-mix(in srgb, var(--accent-navy) 14%, var(--surface));}
  .match-tile.matched{opacity:.35; border-color:var(--accent-pine);}
  .match-tile.wrong{border-color:var(--accent-red); background:color-mix(in srgb, var(--accent-red) 16%, var(--surface));}

  .auth-area{display:flex; align-items:center;}
  .gsi-btn-holder{min-width:100px; min-height:32px;}
  .auth-chip{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .auth-chip .avatar{width:20px; height:20px; border-radius:50%; display:block;}
  .sync-note{
    font-size:.8rem; color:var(--ink-soft); background:var(--surface); border:1px solid var(--rule);
    border-radius:9px; padding:10px 14px; margin-bottom:18px; line-height:1.4;
  }

  /* ---------- history / recent activity ---------- */
  .history-list{display:flex; flex-direction:column; gap:8px; margin-bottom:20px;}
  .history-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--rule); border-radius:9px; padding:11px 14px;
  }
  .history-left{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .history-label{font-size:.86rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .history-date{font-size:.72rem; color:var(--ink-soft);}
  .history-score{display:flex; align-items:center; gap:8px; font-size:.82rem; flex-shrink:0;}
  .history-pct{font-weight:700; min-width:3.2em; text-align:right;}
  .history-score.good .history-pct{color:var(--accent-pine-ink);}
  .history-score.ok .history-pct{color:var(--accent-gold-ink);}
  .history-score.low .history-pct{color:var(--accent-red-ink);}

  /* ---------- report card ---------- */
  .grade-hero{
    background:var(--surface); border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow);
    padding:20px 22px; display:flex; align-items:center; gap:18px; margin-bottom:14px;
  }
  .grade-letter{font-family:'Piazzolla',serif; font-weight:700; font-size:2.6rem; line-height:1; min-width:58px; text-align:center;}
  .grade-hero.good .grade-letter{color:var(--accent-pine-ink);}
  .grade-hero.ok .grade-letter{color:var(--accent-gold-ink);}
  .grade-hero.low .grade-letter{color:var(--accent-red-ink);}
  .grade-info{display:flex; flex-direction:column; gap:3px;}
  .grade-score{font-size:1.2rem; font-weight:700;}
  .grade-formula{font-size:.76rem; color:var(--ink-soft); line-height:1.45; max-width:48ch;}
  .trend-note{font-size:.83rem; padding:9px 14px; border-radius:9px; background:var(--surface); border:1px solid var(--rule); margin-bottom:16px; line-height:1.4;}
  .trend-note.up{color:var(--accent-pine-ink);}
  .trend-note.down{color:var(--accent-red-ink);}
  .breakdown-fill.good{background:var(--accent-pine);}
  .breakdown-fill.ok{background:var(--accent-gold);}
  .breakdown-fill.low{background:var(--accent-red);}
  .breakdown-row.topic-row{cursor:pointer;}
  .breakdown-row.topic-row:hover .breakdown-name{color:var(--ink); text-decoration:underline;}
  .breakdown-row.unattempted .breakdown-fill{background:var(--surface-2);}
  .breakdown-row.unattempted .breakdown-num{color:var(--ink-soft); opacity:.7;}

  /* ---------- topic icons ---------- */
  .topic-title{display:flex; align-items:center; gap:8px;}
  .topic-icon{font-size:1.05rem; line-height:1; flex-shrink:0;}

  /* ---------- recommended session ---------- */
  .recommend{
    background:var(--surface); border:1px solid var(--accent-navy); border-radius:14px;
    box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .recommend-body{flex:1; min-width:200px; display:flex; flex-direction:column; gap:5px;}
  .recommend-body h3{font-size:1.15rem;}
  .recommend-body p{margin:0; font-size:.83rem; color:var(--ink-soft); line-height:1.45;}
  .recommend .btn{flex-shrink:0;}

  /* ---------- streak heatmap ---------- */
  .heatmap{
    background:var(--surface); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow);
    padding:14px 18px; margin-bottom:8px; overflow-x:auto;
  }
  .heat-grid{display:grid; grid-template-rows:repeat(7,11px); grid-auto-flow:column; grid-auto-columns:11px; gap:3px;}
  .heat-cell{width:11px; height:11px; border-radius:2px; background:var(--surface-2); border:1px solid transparent;}
  .heat-cell.l1{background:color-mix(in srgb, var(--accent-pine) 34%, var(--surface-2));}
  .heat-cell.l2{background:color-mix(in srgb, var(--accent-pine) 62%, var(--surface-2));}
  .heat-cell.l3{background:var(--accent-pine);}
  .heat-cell.today{border-color:var(--accent-gold);}
  .heat-legend{display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--ink-soft); margin-top:10px;}

  /* ---------- badges ---------- */
  .badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-bottom:8px;}
  .badge{
    background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:12px 14px;
    display:flex; align-items:center; gap:10px; font-size:.8rem; box-shadow:var(--shadow);
  }
  .badge .bicon{font-size:1.3rem; line-height:1;}
  .badge .bname{font-weight:600;}
  .badge .bdesc{font-size:.72rem; color:var(--ink-soft); line-height:1.35;}
  .badge.locked{opacity:.45; box-shadow:none;}

  /* ---------- sparkline ---------- */
  .sparkline{
    background:var(--surface); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow);
    padding:14px 18px; margin-bottom:14px;
  }
  .sparkline svg{display:block; width:100%; height:96px; overflow:visible;}

  /* ---------- filters ---------- */
  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .filter-group{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .filter-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600;}
  .filter-btn{
    padding:6px 11px; border-radius:999px; border:1px solid var(--rule); background:var(--surface);
    font-size:.76rem; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .filter-btn.active{background:var(--accent-navy); border-color:var(--accent-navy); color:var(--on-accent);}

  /* ---------- settings ---------- */
  .setting-card{
    background:var(--surface); border:1px solid var(--rule); border-radius:12px; box-shadow:var(--shadow);
    padding:16px 18px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px;
  }
  .setting-card h3{font-size:1rem;}
  .setting-card p{margin:0; font-size:.8rem; color:var(--ink-soft); line-height:1.5;}
  .setting-control{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .setting-control .btn{flex:0 0 auto;}
  .setting-value{font-family:'IBM Plex Mono',monospace; font-size:.85rem; font-weight:600; min-width:5.5em;}
  .setting-input{
    padding:9px 12px; border-radius:8px; border:1px solid var(--rule); background:var(--surface-2);
    color:var(--ink); font-size:.88rem; font-family:'IBM Plex Mono',monospace;
  }
  .why-note{
    font-size:.76rem; color:var(--ink-soft); line-height:1.5; border-left:2px solid var(--rule);
    padding-left:10px; margin-top:2px;
  }

  /* ---------- speed round timer ---------- */
  .timer-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .timer-track{flex:1; height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
  .timer-fill{height:100%; border-radius:99px; background:var(--accent-gold); transition:width .2s linear;}
  .timer-fill.urgent{background:var(--accent-red);}
  .timer-text{font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--ink-soft); min-width:3.2em; text-align:right;}

  /* ---------- reference sheet ---------- */
  .ref-table{width:100%; border-collapse:collapse; font-size:.86rem; margin-bottom:20px;}
  .ref-table th, .ref-table td{border:1px solid var(--rule); padding:7px 10px; text-align:left;}
  .ref-table th{background:var(--surface-2); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);}
  .ref-section{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow);}
  .ref-section h3{font-size:1.1rem; margin-bottom:10px;}

  /* ---------- tablet + landscape ---------- */
  @media (min-width:521px) and (max-width:900px){
    .app-shell{padding:18px 24px 56px;}
    .dash-grid{grid-template-columns:repeat(2,1fr);}
    .jump-grid{grid-template-columns:repeat(2,1fr);}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .match-grid{grid-template-columns:repeat(3,1fr);}
    .session-card{max-width:100%;}
    .flip-outer{max-width:100%;}
  }
  @media (max-height:480px) and (orientation:landscape){
    .app-shell{padding:12px 20px 40px;}
    .flip-card, .flip-inner{min-height:170px;}
    .flip-face{padding:18px 20px;}
    .card-prompt{font-size:1.2rem;}
    .card-answer{font-size:1.25rem;}
    .topbar{padding-bottom:12px; margin-bottom:14px;}
  }

  @media print{
    .nav-wrap, .topbar, .footer-links, .btn, .back-btn{display:none !important;}
    .ref-section{break-inside:avoid; box-shadow:none; border-color:#999;}
    body{background:#fff; color:#000;}
  }
</style>

  /* ---------- 1. Chapter 2 vocabulary (28 terms) ---------- */

  /* ============================= UTIL ============================= */
  function $(sel, root){ return (root||document).querySelector(sel); }
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function stripHtml(html){
    return String(html).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function shuffled(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function sample(arr, n){ return shuffled(arr).slice(0, n); }
  // Loose matching: case, punctuation, and surrounding whitespace don't count.
  function normalize(s){
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[’']/g, "'").replace(/[¿?¡!.,;:%]/g,'').replace(/\s+/g,' ').trim();
  }
  function isCorrectTyped(item, val){
    return item.answer.some(function(a){ return normalize(a) === normalize(val); });
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function daysFromToday(n){
    var d = new Date();
    d.setDate(d.getDate()+n);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  /* ============================= PROGRESS / SRS ============================= */
  var STORE_KEY = 'aphg_progress_v1';
  var INTERVALS = [0,1,3,7,14,30];

  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {items:{}, streak:{count:0,last:null}};
  }
  var PROGRESS = loadProgress();
  migrateProgress(PROGRESS);

  function migrateProgress(P){
    if(!P.history) P.history = [];
    if(!P.settings) P.settings = {};
    if(!P.days){
      P.days = {};
      P.history.forEach(function(h){ if(h.date) P.days[h.date] = (P.days[h.date]||0) + (h.total||1); });
      if(P.streak && P.streak.last && !P.days[P.streak.last]) P.days[P.streak.last] = 1;
    }
    if(!P.streak) P.streak = {count:0, last:null};
    if(!P.items) P.items = {};
    return P;
  }

  var DEFAULT_SETTINGS = {
    quizSize:12, testSize:30, typedFrom:2,
    theme:'system', textScale:100
  };
  function settings(){
    var out = {};
    var saved = PROGRESS.settings || {};
    Object.keys(DEFAULT_SETTINGS).forEach(function(k){
      out[k] = (saved[k] === undefined || saved[k] === null) ? DEFAULT_SETTINGS[k] : saved[k];
    });
    return out;
  }
  function setSetting(k, v){
    if(!PROGRESS.settings) PROGRESS.settings = {};
    PROGRESS.settings[k] = v;
    saveProgress();
  }

  function saveProgress(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(PROGRESS)); }catch(e){}
    if(AUTH.user) pushProgress();
  }

  /* ============================= GOOGLE SIGN-IN / CLOUD SYNC =============================
     Entirely optional and self-disabling: on a page not served by our own
     backend (e.g. this same file published elsewhere), the client id
     placeholder is never replaced and every /api/* call below just fails
     silently — the app then behaves exactly as the local-only version it
     always was. Nothing here is required for the app to work. */
  var GOOGLE_CLIENT_ID = (function(){
    var v = (typeof window !== 'undefined') ? window.__GOOGLE_CLIENT_ID__ : null;
    return (v && v.indexOf('.apps.googleusercontent.com') !== -1) ? v : null;
  })();
  var AUTH = { user:null };
  // Tags this subject's progress/session data so the shared hub server keeps
  // it in its own file, separate from every other section's.
  var SUBJECT = 'aphg';

  function apiFetch(url, opts){
    opts = opts || {};
    var headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
    return fetch(url, Object.assign({credentials:'same-origin'}, opts, {headers:headers}))
      .then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(data){
          return {ok:r.ok, status:r.status, data:data};
        });
      });
  }

  function pushProgress(){
    if(!AUTH.user) return;
    apiFetch('/api/progress?subject='+SUBJECT, {method:'PUT', body: JSON.stringify(PROGRESS)}).catch(function(){});
  }

  function pullProgress(){
    return apiFetch('/api/progress?subject='+SUBJECT, {method:'PUT', body: JSON.stringify(PROGRESS)}).then(function(res){
      if(res.ok && res.data.progress){
        PROGRESS = migrateProgress(res.data.progress);
      }
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(PROGRESS)); }catch(e){}
      render();
    }).catch(function(){});
  }

  function replaceProgressOnServer(){
    if(!AUTH.user) return;
    apiFetch('/api/progress?subject='+SUBJECT+'&mode=replace', {method:'PUT', body: JSON.stringify(PROGRESS)}).catch(function(){});
  }

  function handleGoogleCredential(response){
    apiFetch('/api/auth/google', {method:'POST', body: JSON.stringify({credential: response.credential})})
      .then(function(res){
        if(res.ok && res.data.user){
          AUTH.user = res.data.user;
          return pullProgress();
        }
        render();
      }).catch(function(){});
  }

  function signOut(){
    apiFetch('/api/auth/logout', {method:'POST'}).catch(function(){});
    AUTH.user = null;
    render();
  }

  function initAuth(){
    if(!GOOGLE_CLIENT_ID) return;
    apiFetch('/api/me').then(function(res){
      if(res.ok && res.data.user){
        AUTH.user = res.data.user;
        pullProgress();
      }
    }).catch(function(){});
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function(){
      try{
        google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:handleGoogleCredential});
      }catch(e){}
      render();
    };
    document.head.appendChild(s);
  }

  function getProg(id){ return PROGRESS.items[id]; }

  function recordAnswer(id, correct){
    var p = PROGRESS.items[id] || {box:-1, due:todayStr(), seen:0, correct:0, incorrect:0};
    p.seen++;
    if(correct){
      p.correct++;
      p.box = Math.min((p.box<0?-1:p.box)+1, 5);
      p.due = daysFromToday(INTERVALS[Math.max(p.box,0)]);
    }else{
      p.incorrect++;
      p.box = 0;
      p.due = todayStr();
    }
    PROGRESS.items[id] = p;
    bumpDay();
    bumpStreak();
    saveProgress();
  }

  function seedLearn(id, gotIt){
    var p = PROGRESS.items[id] || {box:-1, due:todayStr(), seen:0, correct:0, incorrect:0};
    p.seen++;
    if(gotIt){ p.box = Math.max(p.box,1); p.due = daysFromToday(INTERVALS[1]); }
    else { p.box = 0; p.due = todayStr(); }
    PROGRESS.items[id] = p;
    bumpDay();
    bumpStreak();
    saveProgress();
  }

  function bumpDay(){
    if(!PROGRESS.days) PROGRESS.days = {};
    var t = todayStr();
    PROGRESS.days[t] = (PROGRESS.days[t]||0) + 1;
  }

  function bumpStreak(){
    var t = todayStr();
    var s = PROGRESS.streak;
    if(s.last === t) return;
    if(s.last){
      var y = new Date(); y.setDate(y.getDate()-1);
      var yStr = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
      s.count = (s.last === yStr) ? s.count+1 : 1;
    } else {
      s.count = 1;
    }
    s.last = t;
  }

  function isMastered(id){ var p = getProg(id); return p && p.box >= 3; }
  function isDue(id){ var p = getProg(id); return !p || p.due <= todayStr(); }
  function isUnseen(id){ var p = getProg(id); return !p; }
  function boxOf(id){ var p = getProg(id); return p ? p.box : -1; }

  /* ---------- standing decks ---------- */
  function dueItems(){
    return ALL_ITEMS.filter(function(it){ var p = getProg(it.id); return p && p.due <= todayStr(); });
  }
  function dueCount(){ return dueItems().length; }
  function newCount(){ return ALL_ITEMS.filter(function(it){ return isUnseen(it.id); }).length; }

  function missedItems(){
    return ALL_ITEMS.filter(function(it){ var p = getProg(it.id); return p && p.incorrect > 0; })
      .sort(function(a,b){
        var pa = getProg(a.id), pb = getProg(b.id);
        var ra = pa.correct/Math.max(pa.seen,1), rb = pb.correct/Math.max(pb.seen,1);
        if(ra !== rb) return ra - rb;
        return pb.incorrect - pa.incorrect;
      });
  }

  // Answers of three words or more — mostly definitions and explanations,
  // the only multi-word productions in this material.
  function sentenceItems(){
    return ALL_ITEMS.filter(function(it){
      var a = (it.answer[0]||'').trim();
      return a.split(/\s+/).length >= 3;
    });
  }

  // Cards whose answer is short enough to read aloud meaningfully.
  function listeningItems(){
    return ALL_ITEMS.filter(function(it){
      return (it.answer[0]||'').length <= 60;
    });
  }

  function masteredItems(){ return ALL_ITEMS.filter(function(it){ return isMastered(it.id); }); }

  function weakestTopics(n){
    return TOPICS.map(function(t){ return {id:t.id, acc:topicAccuracy(t.id)}; })
      .filter(function(x){ return x.acc !== null; })
      .sort(function(a,b){ return a.acc - b.acc; })
      .slice(0, n)
      .map(function(x){ return x.id; });
  }

  function recommendedSession(n){
    var out = [], used = {};
    function add(list){
      list.forEach(function(it){
        if(out.length >= n || used[it.id]) return;
        used[it.id] = 1; out.push(it);
      });
    }
    add(shuffled(dueItems()));
    weakestTopics(3).forEach(function(tid){ add(shuffled(ITEMS_BY_TOPIC[tid]||[])); });
    add(shuffled(ALL_ITEMS.filter(function(it){ return isUnseen(it.id); })));
    add(shuffled(ALL_ITEMS));
    return shuffled(out);
  }
  function recommendReason(){
    var d = dueCount();
    if(d >= 5) return d + ' cards are ready to review — those come first.';
    var weak = weakestTopics(1);
    if(weak.length) return 'A few ready-to-review cards, then extra reps on your weakest topics (' + TOPIC_MAP[weak[0]].name + ' is lowest right now).';
    return 'A mixed opening session across every topic, to find out where you stand.';
  }

  function badgeDefs(){
    var streak = PROGRESS.streak.count||0;
    var topicsMastered = TOPICS.filter(function(t){ return topicMastery(t.id) >= 80; }).length;
    var sessions = (PROGRESS.history||[]).length;
    var perfect = (PROGRESS.history||[]).filter(function(h){ return h.pct === 100 && h.total >= 8; }).length;
    return [
      {id:'first-session', icon:'🌱', name:'First Session', desc:'Completed your first session.', earned: sessions >= 1},

  function topicMastery(topicId){
    var items = ITEMS_BY_TOPIC[topicId] || [];
    if(!items.length) return 0;
    var m = items.filter(function(it){ return isMastered(it.id); }).length;
    return Math.round(100*m/items.length);
  }
  function overallMastery(){
    var m = ALL_ITEMS.filter(function(it){ return isMastered(it.id); }).length;
    return Math.round(100*m/ALL_ITEMS.length);
  }
  function masteredCount(){ return ALL_ITEMS.filter(function(it){ return isMastered(it.id); }).length; }
  function categoryMastery(cat){
    var items = ALL_ITEMS.filter(function(it){ return TOPIC_MAP[it.topic].cat === cat; });
    if(!items.length) return 0;
    var m = items.filter(function(it){ return isMastered(it.id); }).length;
    return Math.round(100*m/items.length);
  }

  function accuracyOf(items){
    var progs = items.map(function(it){ return getProg(it.id); }).filter(Boolean);
    var seen = progs.reduce(function(s,p){ return s+p.seen; }, 0);
    var correct = progs.reduce(function(s,p){ return s+p.correct; }, 0);
    return { pct: seen ? Math.round(100*correct/seen) : null, seen: seen, correct: correct };
  }
  function topicAccuracy(topicId){ return accuracyOf(ITEMS_BY_TOPIC[topicId] || []).pct; }
  function categoryAccuracy(cat){
    return accuracyOf(ALL_ITEMS.filter(function(it){ return TOPIC_MAP[it.topic].cat === cat; })).pct;
  }
  function typeAccuracy(types){
    return accuracyOf(ALL_ITEMS.filter(function(it){ return types.indexOf(it.type) !== -1; }));
  }
  function lifetimeAccuracy(){ return accuracyOf(ALL_ITEMS).pct || 0; }
  function attemptedCount(){ return ALL_ITEMS.filter(function(it){ return !!getProg(it.id); }).length; }
  function coveragePct(){ return ALL_ITEMS.length ? Math.round(100*attemptedCount()/ALL_ITEMS.length) : 0; }
  function totalQuestionsAnswered(){ return accuracyOf(ALL_ITEMS).seen; }

  function modeStats(){
    var byMode = {};
    (PROGRESS.history||[]).forEach(function(h){
      if(!byMode[h.mode]) byMode[h.mode] = {count:0, sum:0};
      byMode[h.mode].count++;
      byMode[h.mode].sum += h.pct;
    });
    return byMode;
  }
  var MODE_LABELS = {

    recommended:'Recommended Session', missed:'Missed-Cards Deck', sentence:'Long-Answer Drill',
    listening:'Listening Drill', speed:'Timed Speed Round', final:'Comprehensive Final Exam'

  function recentTrend(){
    var hist = PROGRESS.history || [];
    var n = Math.min(5, Math.floor(hist.length/2));
    if(n < 2) return null;
    var avg = function(arr){ return arr.reduce(function(s,h){ return s+h.pct; },0) / arr.length; };
    var recent = hist.slice(-n);
    var prior = hist.slice(-2*n, -n);
    var recentAvg = avg(recent), priorAvg = avg(prior);
    return { n:n, recentAvg: Math.round(recentAvg), priorAvg: Math.round(priorAvg), delta: Math.round(recentAvg-priorAvg) };
  }

  function dueForecast(days){
    var out = [];
    for(var i=0; i<days; i++){
      var key = daysFromToday(i);
      var n = ALL_ITEMS.filter(function(it){
        var p = getProg(it.id);
        if(!p) return false;
        return i === 0 ? p.due <= key : p.due === key;
      }).length;
      out.push({date:key, count:n, offset:i});
    }
    return out;
  }

  function compositeGrade(){
    var mastery = overallMastery(), accuracy = lifetimeAccuracy(), coverage = coveragePct();
    var score = Math.round(mastery*0.4 + accuracy*0.35 + coverage*0.25);
    var letter = score>=90?'A':score>=80?'B':score>=70?'C':score>=60?'D':'F';
    return { score:score, letter:letter, mastery:mastery, accuracy:accuracy, coverage:coverage };
  }

  function mcCapablePool(pool){
    return pool.filter(function(it){ return !!(it.choices || it.pool); });

  /* ============================= SESSION SELECTION ============================= */
  function pickWeighted(pool, n, preferSeen){
    var scored = pool.map(function(it){
      var due = isDue(it.id) ? 1 : 0;
      var unseen = isUnseen(it.id);
      var unseenScore = preferSeen ? (unseen ? -1 : 0) : (unseen ? 1 : 0);
      return {it:it, score: due*2 + unseenScore + Math.random()*0.6};
    });
    scored.sort(function(a,b){ return b.score-a.score; });
    var top = scored.slice(0, Math.max(n*3, Math.min(20,pool.length)));
    return shuffled(top).slice(0,n).map(function(x){ return x.it; });
  }

  function pickTopicSession(topicId, n){
    return pickWeighted(ITEMS_BY_TOPIC[topicId]||[], n);
  }

  function pickMixedSession(n, preferSeen){
    var pools = TOPICS.map(function(t){ return ITEMS_BY_TOPIC[t.id]||[]; });
    var quota = Math.floor(n/pools.length);
    var remainder = n - quota*pools.length;
    var out = [];
    pools.forEach(function(p, i){
      var take = quota + (i<remainder?1:0);
      out = out.concat(pickWeighted(p, take, preferSeen));
    });
    return shuffled(out);
  }

  /* ============================= QUESTION RENDERING LOGIC ============================= */
  function renderMode(item, forceMode){
    if(forceMode) return forceMode;
    if(item.forceTyped) return 'typed';
    if(item.type === 'typed') return 'typed';
    if(item.type === 'mc') return 'mc';
    var box = boxOf(item.id);
    return box >= settings().typedFrom ? 'typed' : 'mc';
  }

  function distractorsFor(item){
    if(item.choices) return item.choices;
    if(item.pool){
      var others = item.pool.filter(function(v){ return v !== item.answer[0]; });
      return sample(others, Math.min(3, others.length)).concat(item.answer);
    }
    return item.answer;
  }

  function prepQuestion(item, forceMode){
    var mode = renderMode(item, forceMode);
    var opts = null;
    if(mode === 'mc'){
      opts = shuffled(distractorsFor(item)).slice(0,4);
      if(opts.indexOf(item.answer[0]) === -1) opts[0] = item.answer[0];
      opts = shuffled(opts);
    }
    return {mode:mode, opts:opts};
  }

  function downloadFile(filename, text, mime){

      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
      return true;
    }catch(e){ return false; }
  }

  function unitsFor(topics){

      var ts = g.topicIds.map(function(id){ return byId[id]; }).filter(Boolean);

  function sparklineCard(hist){
    var wrap = el('div','sparkline');
    var pts = hist.map(function(h){ return h.pct; });
    var w = 600, h = 96, pad = 6;
    var n = pts.length;
    var x = function(i){ return n === 1 ? w/2 : pad + i*(w-2*pad)/(n-1); };
    var y = function(v){ return h - pad - (v/100)*(h-2*pad); };
    var d = pts.map(function(v,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); }).join(' ');
    var dots = pts.map(function(v,i){
      return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="2.5" fill="var(--accent-navy)"/>';
    }).join('');
    wrap.innerHTML = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Score trend">'
      + '<line x1="0" y1="'+y(50).toFixed(1)+'" x2="'+w+'" y2="'+y(50).toFixed(1)+'" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 4"/>'

  function personalCallout(hist){
    if(hist.length < 3) return null;
    var last = hist[hist.length-1];
    var sameMode = hist.filter(function(h){ return h.mode === last.mode; });
    var better = sameMode.filter(function(h){ return h.pct > last.pct; }).length;
    var rank = better + 1;
    var name = MODE_LABELS[last.mode] || last.mode;
    if(sameMode.length < 2) return null;
    var suffix = rank === 1 ? 'best' : (rank === 2 ? '2nd-best' : (rank === 3 ? '3rd-best' : rank+'th-best'));
    if(rank > 3 && rank > sameMode.length/2) return null;
    return 'Your most recent ' + name + ' (' + last.pct + '%) is your ' + suffix + ' out of ' + sameMode.length + '.';
  }

  function pickFinalExam(n){
    var weak = weakestTopics(5);
    var half = Math.floor(n/2);
    var out = pickMixedSession(n-half, true);
    var used = {}; out.forEach(function(it){ used[it.id]=1; });
    var weakPool = [];
    weak.forEach(function(tid){ weakPool = weakPool.concat(ITEMS_BY_TOPIC[tid]||[]); });
    if(!weakPool.length) weakPool = ALL_ITEMS;
    shuffled(weakPool).forEach(function(it){
      if(out.length >= n || used[it.id]) return;
      used[it.id]=1; out.push(it);
    });
    shuffled(ALL_ITEMS).forEach(function(it){
      if(out.length >= n || used[it.id]) return;
      used[it.id]=1; out.push(it);
    });
    return shuffled(out);
  }

  var STANDING_DECKS = {missed:1, speed:1};

  function methodAvailability(id){
    if(id === 'missed'){
      var n = missedItems().length;
      return n >= 2 ? {ready:true, note:n+' card'+(n===1?'':'s')+' in the deck right now.'}
                    : {ready:false, note:'Nothing missed yet — this fills up as you get things wrong.'};
    }
    if(id === 'speed'){
      var m = masteredItems().length;
      return m >= 5 ? {ready:true, note:m+' mastered card'+(m===1?'':'s')+' eligible.'}
                    : {ready:false, note:'Unlocks at 5 mastered cards ('+m+' so far) — speed only helps once material is solid.'};
    }
    if(id === 'listening'){
      return speechAvailable()
        ? {ready:true, note:'Uses your device\'s voice synthesis.'}
        : {ready:false, note:'This browser has no speech synthesis available.'};
    }
    if(id === 'sentence'){
      var t = sentenceItems().length;
      return t >= 2 ? {ready:true, note:t+' long-answer cards available.'} : {ready:false, note:'No long-answer cards available.'};
    }
    return {ready:true, note:''};
  }

  function startMethod(methodId, topicId){
    var pool = topicId ? (ITEMS_BY_TOPIC[topicId]||[]) : ALL_ITEMS;
    var label = topicId ? TOPIC_MAP[topicId].name : 'All Topics';
    if(methodId === 'flashcards'){
      var items = topicId ? shuffled(pool) : pickWeighted(pool, 25);
      go('learn', {topicId:topicId, learnIdx:0, learnItems:items, scopeLabel:label});
    } else if(methodId === 'typed-drill'){
      startSession('typed-drill', pickWeighted(pool, topicId?10:15), 'Fill-in-the-Blank — '+label, 'typed');
    } else if(methodId === 'mc-drill'){
      startSession('mc-drill', pickWeighted(mcCapablePool(pool), topicId?10:15), 'Multiple Choice Drill — '+label, 'mc');
    } else if(methodId === 'matching'){
      startMatching(pickWeighted(pool, 6), 'Matching Pairs — '+label, pool);
    } else if(methodId === 'missed'){
      var missed = missedItems().slice(0, 15);
      if(missed.length < 1) return;
      startSession('missed', shuffled(missed), 'Missed-Cards Deck');
    } else if(methodId === 'sentence'){
      var sPool = sentenceItems().filter(function(it){ return !topicId || it.topic === topicId; });
      if(!sPool.length) return;
      startSession('sentence', pickWeighted(sPool, Math.min(10, sPool.length)), 'Long-Answer Drill — '+label, 'typed');
    } else if(methodId === 'listening'){
      var lPool = listeningItems().filter(function(it){ return !topicId || it.topic === topicId; });
      if(!lPool.length) return;
      startSession('listening', pickWeighted(lPool, Math.min(12, lPool.length)), 'Listening Drill — '+label, 'typed', {listen:true});
    } else if(methodId === 'speed'){
      var mPool = masteredItems();
      if(mPool.length < 2) return;
      startSession('speed', pickWeighted(mPool, Math.min(20, mPool.length)), 'Timed Speed Round', null, {speedMs:12000});
    }
  }

  /* ---------- MATCHING PAIRS ---------- */
  function startMatching(items, label, scopePool){
    if(items.length < 2) return;
    var cards = [];
    items.forEach(function(it){
      cards.push({cardId:it.id+'-p', itemId:it.id, side:'p', html:escapeHtml(stripHtml(it.prompt)), matched:false});
      cards.push({cardId:it.id+'-a', itemId:it.id, side:'a', html:escapeHtml(it.answer[0]), matched:false});
    });
    go('matching', {matchLabel:label, matchItems:items, matchCards:shuffled(cards), matchSelected:[], matchWrong:[], matchMistakes:{}, matchDone:false, matchScopePool:scopePool||ALL_ITEMS});
  }

    card.appendChild(el('div','q-prompt', state.matchLabel||'Matching Pairs'));

    var matchedCount = state.matchCards.filter(function(c){return c.matched;}).length;
    card.appendChild(el('div','progress-text mono', (matchedCount/2)+' / '+(state.matchCards.length/2)+' matched'));

    if(state.matchDone){
      var allCorrect = state.matchItems.every(function(it){ return !state.matchMistakes[it.id]; });
      var fb = el('div','feedback '+(allCorrect?'correct':'incorrect'));
      fb.appendChild(el('span','fmark', allCorrect?'✓':'★'));
      fb.appendChild(el('div','', allCorrect ? '<b>Perfect round — no mismatches!</b>' : '<b>All matched.</b> A few took more than one try — those are now scheduled to come back sooner.'));
      card.appendChild(fb);
      var footer = el('div','session-footer');
      var again = el('button','btn btn-primary','Play Again');
      again.onclick = function(){ startMatching(pickWeighted(state.matchScopePool||ALL_ITEMS, 6), state.matchLabel, state.matchScopePool); };
      var exit = el('button','btn btn-ghost','Back to Home');
      exit.onclick = function(){ go('home'); };
      footer.appendChild(exit);
      footer.appendChild(again);
      card.appendChild(footer);
    } else {
      var grid = el('div','match-grid');
      state.matchCards.forEach(function(c){
        var tile = el('button','match-tile', c.html);
        if(c.matched) tile.classList.add('matched');
        if(state.matchSelected.indexOf(c.cardId) !== -1) tile.classList.add('selected');
        if(state.matchWrong.indexOf(c.cardId) !== -1) tile.classList.add('wrong');
        tile.disabled = c.matched || state.matchWrong.length>0;
        tile.onclick = function(){ handleMatchClick(c.cardId); };
        grid.appendChild(tile);
      });
      card.appendChild(grid);
    }
    wrap.appendChild(card);
    return wrap;
  }

  function handleMatchClick(cardId){
    var cards = state.matchCards;
    var clicked = cards.filter(function(c){return c.cardId===cardId;})[0];
    if(!clicked || clicked.matched || state.matchSelected.indexOf(cardId)!==-1) return;
    state.matchSelected.push(cardId);
    if(state.matchSelected.length < 2){ render(); return; }

    var aId = state.matchSelected[0], bId = state.matchSelected[1];
    var a = cards.filter(function(c){return c.cardId===aId;})[0];
    var b = cards.filter(function(c){return c.cardId===bId;})[0];
    var isMatch = a.itemId === b.itemId && a.side !== b.side;

    if(isMatch){
      a.matched = true; b.matched = true;
      state.matchSelected = [];
      var allDone = cards.every(function(c){return c.matched;});
      if(allDone){
        state.matchItems.forEach(function(it){
          recordAnswer(it.id, !state.matchMistakes[it.id]);
        });
        state.matchDone = true;
      }
      render();
    } else {
      state.matchMistakes[a.itemId] = (state.matchMistakes[a.itemId]||0)+1;
      state.matchMistakes[b.itemId] = (state.matchMistakes[b.itemId]||0)+1;
      state.matchWrong = [aId,bId];
      render();
      setTimeout(function(){
        state.matchWrong = [];
        state.matchSelected = [];
        render();
      }, 650);
    }
  }

  /* ---------- SESSION (quiz/test/guided/drills) ---------- */
  function startSession(mode, items, label, forceMode, opts){
    if(!items.length){ return; }
    opts = opts || {};
    go('session', {sessionMode:mode, sessionLabel:label, sessionItems:items, sessionIdx:0, sessionAnswered:false, sessionResults:[], q:prepQuestion(items[0], forceMode), lastChoice:null, lastTypedVal:'', forceMode:forceMode, hintShown:false, historyLogged:false,
      listen: !!opts.listen, speedMs: opts.speedMs || 0, speedDeadline: null});
  }

  function sessionView(){
    var wrap = el('div','');
    var items = state.sessionItems;
    var idx = state.sessionIdx;

    var header = el('div','view-header');
    var back = el('button','back-btn','← Exit');
    back.onclick = function(){ go('home'); };
    header.appendChild(back);
    var track = el('div','progress-track');
    var fill = el('div','progress-fill'); fill.style.width = (100*idx/items.length)+'%';
    track.appendChild(fill);
    header.appendChild(track);
    header.appendChild(el('div','progress-text mono', (idx+1)+' / '+items.length));
    wrap.appendChild(header);

    if(idx >= items.length){
      go('results', {});
      return wrap;
    }

    var item = items[idx];
    var topic = TOPIC_MAP[item.topic];
    var card = el('div','session-card');
    card.appendChild(el('div','qchip cat-'+topic.cat, topic.name));

    if(state.listen){
      card.appendChild(el('div','q-prompt','🎧 Type what you hear'));
      var replay = el('button','btn btn-ghost btn-sm','🔊 Play again');
      replay.onclick = function(){ speak(item.answer[0]); };
      var replayRow = el('div','hint-row');
      replayRow.appendChild(replay);
      card.appendChild(replayRow);
      if(!state.sessionAnswered) speak(item.answer[0]);
    } else {
      card.appendChild(el('div','q-prompt', item.prompt));
    }

    if(!state.q) state.q = prepQuestion(item, state.forceMode);
    var mode = state.listen ? 'typed' : state.q.mode;
    var answered = state.sessionAnswered;

    if(state.speedMs && !answered){
      if(!state.speedDeadline) state.speedDeadline = Date.now() + state.speedMs;
      var timerRow = el('div','timer-row');
      var timerTrack = el('div','timer-track');
      var timerFill = el('div','timer-fill');
      timerTrack.appendChild(timerFill);
      var timerText = el('div','timer-text mono','');
      timerRow.appendChild(timerTrack);
      timerRow.appendChild(timerText);
      card.appendChild(timerRow);
      var paint = function(){
        var left = speedRemaining();
        timerFill.style.width = Math.round(100*left/state.speedMs)+'%';
        if(left < state.speedMs*0.25) timerFill.classList.add('urgent');
        timerText.innerHTML = (left/1000).toFixed(1)+'s';
      };
      paint();
      if(typeof window !== 'undefined' && typeof window.requestAnimationFrame === 'function'){
        clearSpeedTimer();
        speedTimer = setInterval(function(){
          if(state.view !== 'session' || state.sessionAnswered){ clearSpeedTimer(); return; }
          paint();
          if(speedRemaining() <= 0){
            clearSpeedTimer();
            if(speedExpire(item)) render();
          }
        }, 100);
      }
    }

    var hintRow = null;
    if(state.sessionMode === 'guided' && !answered){
      hintRow = el('div','hint-row');
      if(!state.hintShown){
        var hintBtn = el('button','btn btn-ghost btn-sm','💡 Show a hint');
        hintBtn.onclick = function(){ state.hintShown = true; render(); };
        hintRow.appendChild(hintBtn);
      } else {
        var hintText = item.note || ('Starts with "'+item.answer[0].charAt(0).toUpperCase()+'..."');
        hintRow.appendChild(el('div','hint-text','💡 '+escapeHtml(hintText)));
      }
      card.appendChild(hintRow);
    }

    function afterAnswer(){
      if(hintRow && hintRow.parentNode) hintRow.parentNode.removeChild(hintRow);
      appendFeedback(card, item, mode, idx, items);
    }

    if(mode === 'mc'){
      var choicesWrap = el('div','choices');
      var opts = state.q.opts;
      var choiceButtons = [];
      opts.forEach(function(opt, oi){
        var b = el('button','choice-btn', '<span class="choice-key mono">'+(oi+1)+'</span>'+escapeHtml(opt));
        b.disabled = !!answered;
        if(answered){
          if(normalize(opt) === normalize(item.answer[0])) b.classList.add('correct');
          else if(opt === state.lastChoice) b.classList.add('incorrect');
        }
        b.onclick = function(){
          if(state.sessionAnswered) return;
          state.lastChoice = opt;
          var correct = normalize(opt) === normalize(item.answer[0]);
          submitAnswer(item, opt, correct);
          choiceButtons.forEach(function(cb){
            cb.disabled = true;
            if(normalize(cb.__opt) === normalize(item.answer[0])) cb.classList.add('correct');
            else if(cb.__opt === opt) cb.classList.add('incorrect');
          });
          afterAnswer();
        };
        b.__opt = opt;
        choiceButtons.push(b);
        choicesWrap.appendChild(b);
      });
      card.appendChild(choicesWrap);
    } else {
      var row = el('div','text-row');
      var input = el('input','text-input');
      input.type = 'text';
      input.placeholder = 'Type your answer...';
      input.autocomplete = 'off';
      input.spellcheck = false;
      if(answered){ input.disabled = true; input.value = state.lastTypedVal || ''; }
      var submitBtn = el('button','btn btn-primary','Check');
      submitBtn.disabled = !!answered;
      function doSubmit(){
        if(state.sessionAnswered) return;
        var val = input.value;
        var correct = isCorrectTyped(item, val);
        state.lastTypedVal = val;
        submitAnswer(item, val, correct);
        input.disabled = true;
        submitBtn.disabled = true;
        afterAnswer();
      }
      input.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') doSubmit(); });
      submitBtn.onclick = doSubmit;
      row.appendChild(input);
      row.appendChild(submitBtn);
      card.appendChild(row);
      setTimeout(function(){ input.focus(); }, 0);
    }

    if(answered){
      appendFeedback(card, item, mode, idx, items);
    }

    wrap.appendChild(card);
    return wrap;
  }

  function appendFeedback(card, item, mode, idx, items){
    var last = state.sessionResults[state.sessionResults.length-1];
    var fb = el('div','feedback '+(last.correct?'correct':'incorrect'));
    if(fb.setAttribute){ fb.setAttribute('role','status'); fb.setAttribute('aria-live','polite'); }
    var mark = el('span','fmark', last.correct?'✓':'✕');
    var body = el('div','');
    if(last.correct){
      body.innerHTML = '<b>Correct!</b>' + (item.note?(' — '+escapeHtml(item.note)):'');
    } else {
      var youWrote = (mode === 'typed' && last.userVal) ? ('Your answer: <b>'+escapeHtml(last.userVal)+'</b><br>') : '';
      body.innerHTML = youWrote + 'Correct answer: <b>'+escapeHtml(item.answer[0])+'</b>' + (item.note?('<br>'+escapeHtml(item.note)):'');
    }
    fb.appendChild(mark);
    fb.appendChild(body);
    card.appendChild(fb);

    var footer = el('div','session-footer');
    var nextBtn = el('button','btn btn-primary','Next →');
    nextBtn.onclick = function(){
      var nextIdx = idx+1;
      var nextQ = nextIdx < items.length ? prepQuestion(items[nextIdx], state.forceMode) : null;
      go('session', {sessionMode:state.sessionMode, sessionLabel:state.sessionLabel, sessionItems:items, sessionIdx:nextIdx, sessionAnswered:false, sessionResults:state.sessionResults, q:nextQ, lastChoice:null, lastTypedVal:'', hintShown:false, speedDeadline:null});
    };
    footer.appendChild(nextBtn);
    card.appendChild(footer);
  }

  function submitAnswer(item, userVal, correct){
    recordAnswer(item.id, correct);
    state.sessionAnswered = true;
    state.sessionResults.push({item:item, userVal:userVal, correct:correct});
  }

  function resultsView(){

      PROGRESS.history.push(entry);

      state.historyLogged = true;
      saveProgress();
      if(AUTH.user){
        apiFetch('/api/session-complete', {method:'POST', body: JSON.stringify(Object.assign({subject:SUBJECT}, entry))}).catch(function(){});
      }

    var top = el('div','results-top');

    var byTopic = {};

      actions.appendChild(reviewBtn);
    }
    var backBtn = el('button','btn btn-ghost','Back to Home');
    backBtn.onclick = function(){ go('home'); };
    actions.appendChild(backBtn);
    wrap.appendChild(actions);

    return wrap;
  }

  function referenceRows(topicId){
    var seen = {}, rows = [];
    (ITEMS_BY_TOPIC[topicId]||[]).forEach(function(it){
      var q = stripHtml(it.prompt).replace(/\s+/g,' ').trim();
      var a = it.answer.join(' / ');

  /* ---------- keyboard ---------- */
  function initKeyboard(){
    if(typeof document === 'undefined' || typeof document.addEventListener !== 'function') return;
    document.addEventListener('keydown', function(ev){
      if(state.view !== 'session') return;
      var tag = ev.target && ev.target.tagName;
      if(tag === 'INPUT' || tag === 'TEXTAREA'){
        return;
      }
      if(ev.key === 'Enter' || ev.key === ' '){
        var next = document.querySelector('.session-footer .btn');
        if(next){ ev.preventDefault(); next.click(); }
        return;
      }
      if(state.sessionAnswered) return;
      var n = parseInt(ev.key, 10);
      if(!n || n < 1 || n > 4) return;
      var buttons = document.querySelectorAll('.choice-btn');
      if(buttons && buttons[n-1]){ ev.preventDefault(); buttons[n-1].click(); }
    });
  }

  applyDisplaySettings();
  render();
  initKeyboard();
  initAuth();
})();
</script>
</body>
</html>
